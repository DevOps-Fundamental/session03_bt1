<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <rect width="920" height="480" fill="rgb(15, 23, 42)" rx="8"/>
  <rect width="920" height="38" fill="rgb(30, 41, 59)" rx="8"/>
  <circle cx="20" cy="19" r="6" fill="rgb(239, 68, 68)"/>
  <circle cx="38" cy="19" r="6" fill="rgb(245, 158, 11)"/>
  <circle cx="56" cy="19" r="6" fill="rgb(34, 197, 94)"/>
  <text x="310" y="24" fill="rgb(148, 163, 184)" font-family="Segoe UI, -apple-system, sans-serif" font-size="12">Client Machine: Connection Test (Port 2222 vs 22)</text>

  <g font-family="Courier New, Consolas, monospace" font-size="13">
    <!-- Test 1: SSH port 2222 (Success) -->
    <text x="24" y="68" fill="rgb(148, 163, 184)">client:~$ </text>
    <text x="110" y="68" fill="rgb(56, 189, 248)">ssh -i ~/.ssh/id_ed25519 -p 2222 devops@128.199.200.100</text>

    <text x="24" y="100" fill="rgb(34, 197, 94)" font-weight="bold">Welcome to Ubuntu 22.04.4 LTS (GNU/Linux 5.15.0-105-generic x86_64)</text>
    <text x="24" y="126" fill="rgb(203, 213, 225)">Last login: Sat Oct  3 07:42:15 2026 from 14.161.20.55</text>
    <text x="24" y="152" fill="rgb(34, 197, 94)">devops@ubuntu-devops-server:~$ </text>
    <text x="275" y="152" fill="rgb(248, 250, 252)">exit</text>
    <text x="24" y="176" fill="rgb(148, 163, 184)">Connection to 128.199.200.100 closed.</text>

    <!-- Test 2: SSH port 22 (Failed) -->
    <text x="24" y="220" fill="rgb(148, 163, 184)">client:~$ </text>
    <text x="110" y="220" fill="rgb(56, 189, 248)">ssh -i ~/.ssh/id_ed25519 -p 22 devops@128.199.200.100</text>

    <text x="24" y="254" fill="rgb(239, 68, 68)" font-weight="bold">ssh: connect to host 128.199.200.100 port 22: Connection refused</text>

    <!-- Test 3: Nmap port scan -->
    <text x="24" y="300" fill="rgb(148, 163, 184)">client:~$ </text>
    <text x="110" y="300" fill="rgb(56, 189, 248)">nmap -p 22,2222 128.199.200.100</text>

    <text x="24" y="332" fill="rgb(203, 213, 225)">Starting Nmap 7.94 ( https://nmap.org )</text>
    <text x="24" y="354" fill="rgb(203, 213, 225)">Nmap scan report for 128.199.200.100</text>
    <text x="24" y="376" fill="rgb(148, 163, 184)">PORT     STATE  SERVICE</text>
    <text x="24" y="398" fill="rgb(239, 68, 68)">22/tcp   closed ssh</text>
    <text x="24" y="420" fill="rgb(34, 197, 94)">2222/tcp open   EtherNetIP-1</text>

    <text x="24" y="456" fill="rgb(148, 163, 184)">client:~$ </text>
  </g>
</svg>
