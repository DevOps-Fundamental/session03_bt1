<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" width="100%" height="100%">
  <rect width="920" height="580" fill="rgb(15, 23, 42)" rx="8"/>
  <rect width="920" height="38" fill="rgb(30, 41, 59)" rx="8"/>
  <circle cx="20" cy="19" r="6" fill="rgb(239, 68, 68)"/>
  <circle cx="38" cy="19" r="6" fill="rgb(245, 158, 11)"/>
  <circle cx="56" cy="19" r="6" fill="rgb(34, 197, 94)"/>
  <text x="300" y="24" fill="rgb(148, 163, 184)" font-family="Segoe UI, -apple-system, sans-serif" font-size="12">Terminal: devops@ubuntu-devops-server — SSH Hardening</text>

  <g font-family="Courier New, Consolas, monospace" font-size="13">
    <!-- Command 1: Open port 2222 in UFW -->
    <text x="24" y="66" fill="rgb(34, 197, 94)">devops@ubuntu-devops-server</text>
    <text x="240" y="66" fill="rgb(248, 250, 252)">:~$ </text>
    <text x="275" y="66" fill="rgb(56, 189, 248)">sudo ufw allow 2222/tcp</text>
    <text x="24" y="88" fill="rgb(203, 213, 225)">Rules updated</text>
    <text x="24" y="106" fill="rgb(203, 213, 225)">Rules updated (v6)</text>

    <!-- Command 2: Restart SSH -->
    <text x="24" y="136" fill="rgb(34, 197, 94)">devops@ubuntu-devops-server</text>
    <text x="240" y="136" fill="rgb(248, 250, 252)">:~$ </text>
    <text x="275" y="136" fill="rgb(56, 189, 248)">sudo systemctl restart ssh</text>

    <!-- Command 3: Verify listening port with ss -->
    <text x="24" y="170" fill="rgb(34, 197, 94)">devops@ubuntu-devops-server</text>
    <text x="240" y="170" fill="rgb(248, 250, 252)">:~$ </text>
    <text x="275" y="170" fill="rgb(56, 189, 248)">sudo ss -tulpn | grep sshd</text>
    <text x="24" y="196" fill="rgb(203, 213, 225)">tcp   LISTEN 0      128          0.0.0.0:2222      0.0.0.0:*    users:(("sshd",pid=3456,fd=3))</text>
    <text x="24" y="216" fill="rgb(203, 213, 225)">tcp   LISTEN 0      128             [::]:2222         [::]:*    users:(("sshd",pid=3456,fd=4))</text>

    <!-- Command 4: Delete old port 22 in UFW -->
    <text x="24" y="250" fill="rgb(34, 197, 94)">devops@ubuntu-devops-server</text>
    <text x="240" y="250" fill="rgb(248, 250, 252)">:~$ </text>
    <text x="275" y="250" fill="rgb(56, 189, 248)">sudo ufw delete allow 22/tcp</text>
    <text x="24" y="272" fill="rgb(203, 213, 225)">Rule deleted</text>
    <text x="24" y="290" fill="rgb(203, 213, 225)">Rule deleted (v6)</text>

    <!-- Command 5: UFW status -->
    <text x="24" y="322" fill="rgb(34, 197, 94)">devops@ubuntu-devops-server</text>
    <text x="240" y="322" fill="rgb(248, 250, 252)">:~$ </text>
    <text x="275" y="322" fill="rgb(56, 189, 248)">sudo ufw status</text>
    <text x="24" y="348" fill="rgb(248, 250, 252)" font-weight="bold">Status: active</text>
    <text x="24" y="374" fill="rgb(148, 163, 184)">To                         Action      From</text>
    <text x="24" y="394" fill="rgb(34, 197, 94)">2222/tcp                   ALLOW       Anywhere</text>
    <text x="24" y="414" fill="rgb(34, 197, 94)">80/tcp                     ALLOW       Anywhere</text>
    <text x="24" y="434" fill="rgb(34, 197, 94)">2222/tcp (v6)              ALLOW       Anywhere (v6)</text>
    <text x="24" y="454" fill="rgb(34, 197, 94)">80/tcp (v6)                ALLOW       Anywhere (v6)</text>

    <text x="24" y="492" fill="rgb(34, 197, 94)">devops@ubuntu-devops-server</text>
    <text x="240" y="492" fill="rgb(248, 250, 252)">:~$ </text>
  </g>
</svg>
